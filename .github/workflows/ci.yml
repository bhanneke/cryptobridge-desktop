name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax check
        run: |
          node --check src/app.js
          for f in src/adapters/*.js src/vendor/qr.js; do node --check "$f"; done
      - name: HTML lint
        run: npx --yes htmlhint src/index.html
      - name: Adapter unit tests
        run: npm test
      - name: E2E (mock flow, system Chrome)
        run: npm run test:e2e

  # Nothing else here builds the thing a user actually receives. Without this
  # the packaged app can break -- a bad CSP, an asset path that only resolves
  # under the dev server, a capability that stops being granted -- while every
  # other job stays green.
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # --bundles app, not the default: the DMG step shells out to AppleScript
      # to arrange the Finder window, which cannot work on a runner with no
      # GUI session. The .app is the artifact that matters.
      - name: Build the app bundle
        run: npm run build -- --bundles app
      - name: Assert the bundle exists and is not a stub
        run: |
          APP="src-tauri/target/release/bundle/macos/CryptoBridge.app"
          test -d "$APP" || { echo "::error::no bundle was produced at $APP"; exit 1; }
          BIN="$APP/Contents/MacOS/cryptobridge-desktop"
          test -x "$BIN" || { echo "::error::bundle has no executable"; exit 1; }
          SIZE=$(du -sk "$APP" | cut -f1)
          echo "bundle size: ${SIZE}KB"
          # A real build is ~15MB; anything tiny means the frontend or the
          # binary did not make it in.
          test "$SIZE" -gt 4000 || { echo "::error::bundle is only ${SIZE}KB — something is missing"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBridge-macos-unsigned
          path: src-tauri/target/release/bundle/macos/CryptoBridge.app
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Runs the loopback-proxy allowlist tests and the live-transport tests.
      # These are the app's only hole in the CSP sandbox — they gate merges.
      - name: Proxy tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # The proxy is meant to have no TLS backend at all: with only http:// and
      # ws:// reachable, it cannot be turned into an exfiltration channel. Fail
      # the build if a dependency ever pulls one in.
      - name: Assert no TLS backend crept into the dependency tree
        run: |
          if cargo tree --manifest-path src-tauri/Cargo.toml -e normal \
               | grep -iE 'rustls|native-tls|openssl|boring'; then
            echo "::error::a TLS stack entered the tree; the loopback proxy must stay plaintext-only"
            exit 1
          fi
          echo "no TLS backend present, as intended"
