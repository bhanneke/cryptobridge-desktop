[package]
name = "cryptobridge-desktop"
version = "0.1.0"
description = "Non-custodial desktop companion for P2P bitcoin on-ramps"
authors = ["Björn Hanneke"]
license = "AGPL-3.0-only"
repository = "https://github.com/bhanneke/cryptobridge-desktop"
edition = "2021"

[lib]
name = "cryptobridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
